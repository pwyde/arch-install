# Read by the systemd user manager at login, and passed to every user service,
# every program started through D-Bus, and niri itself. Programs that D-Bus
# starts, such as the KDE Wallet dialogs and the KDE portal's file dialogs, do
# not inherit niri's environment block.
#
# Takes effect at the next login.

# Qt theming through plasma-integration. Qt and KDE applications read the
# colors from kdeglobals, which Noctalia writes.
QT_QPA_PLATFORMTHEME=kde

# Plasma's application menu, which kbuildsycoca6 uses to index .desktop files
# for the Open With menus in Dolphin.
XDG_MENU_PREFIX=plasma-
