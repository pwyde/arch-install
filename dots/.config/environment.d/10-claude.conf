# Claude Code's environment in the niri session. Shells outside the session,
# which this file does not reach, get the same values from
# ~/.config/fish/conf.d/20-claude.fish. Takes effect at the next login.

# Settings, login and history in the XDG configuration directory rather than
# in ~/.claude.
CLAUDE_CONFIG_DIR=${XDG_CONFIG_HOME:-$HOME/.config}/claude

# No usage metrics, error reports, feedback reports or survey answers. Without
# telemetry, Claude Code also fetches no feature flags, so the features that
# depend on them are unavailable. Other command-line tools honor DO_NOT_TRACK
# as well.
DISABLE_TELEMETRY=1
DO_NOT_TRACK=1
DISABLE_ERROR_REPORTING=1
DISABLE_FEEDBACK_COMMAND=1
CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY=1
