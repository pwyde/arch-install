# VSCodium in portable mode, which keeps its settings, extensions, argv.json
# and caches in the XDG data directory. Without it, extensions and argv.json
# go to ~/.vscode-oss, which no variable but this one moves. Settings are in
# ~/.local/share/vscodium/user-data/User. VSCodium ignores the variable while
# the directory is missing, which desktop-install.sh creates. Takes effect at
# the next login.
VSCODE_PORTABLE=${XDG_DATA_HOME:-$HOME/.local/share}/vscodium
