[bar.default]
capsule = true
center = ["workspaces"]
end = ["tray", "media", "volume", "notifications", "clipboard", "network", "clock", "session"]
margin_edge = 5
start = ["launcher", "cpu", "ram", "network_rx", "network_tx", "temp"]

[lockscreen]
transition = ["fade"]

[shell]
font_family = "Inter"
polkit_agent = true

[shell.greeter_sync]
auto_sync = true

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "kcolorscheme", "kitty", "niri"]
community_ids = ["papirus-icons", "konsole"]

[wallpaper]
transition = ["fade"]

[widget.clock]
format = "{:%a %d %b} {:%H:%M}"

[widget.cpu]
show_value = false

[widget.launcher]
glyph = "navigation-search"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.network_rx]
show_value = false

[widget.network_tx]
show_value = false

[widget.ram]
show_value = false

[widget.temp]
show_value = false

[widget.volume]
show_label = false
