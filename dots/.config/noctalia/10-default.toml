[lockscreen]
transition = ["fade"]

[shell]
font_family = "Adwaita Sans"
polkit_agent = true

[shell.greeter_sync]
auto_sync = true

[theme]
source = "wallpaper"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "kcolorscheme", "kitty", "niri"]
community_ids = ["konsole"]

[wallpaper]
transition = ["fade"]
