# Lock screen layout: the login box near the bottom and a clock above it.
#
# Positions are in logical pixels on the 2560x1440 reference screen named by
# placement_width and placement_height. On a screen of another size, Noctalia
# scales them proportionally. @LOCKSCREEN_OUTPUT@ is the display connector,
# filled in by desktop-install.sh: a login box tied to a connector that does
# not exist is replaced by Noctalia's default one.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-login-box@@LOCKSCREEN_OUTPUT@",
  "lockscreen-widget-0000000000000001",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@@LOCKSCREEN_OUTPUT@"]
box_height = 128.0
box_width = 810.0
cx = 1280.0
cy = 1258.0
output = "@LOCKSCREEN_OUTPUT@"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@@LOCKSCREEN_OUTPUT@".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = false
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = false
show_weather = false

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
box_height = 192.0
box_width = 448.0
cx = 1280.0
cy = 432.0
output = "@LOCKSCREEN_OUTPUT@"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
background = false
color = "on_surface_variant"
shadow = true
