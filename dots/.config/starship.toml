"$schema" = 'https://starship.rs/config-schema.json'

# https://github.com/smithumble/starship-cockpit/

add_newline = true

command_timeout = 2000

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_metrics\
$git_state\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$package\
$docker_context\
$kubernetes\
$shell\
$container\
$jobs\
${custom.memory_usage}\
${custom.battery}\
${custom.keyboard_layout}\
$time\
$cmd_duration\
$status\
$line_break\
$character\
"""

[os]
disabled = false
style = "fg:red"
format = '[$symbol ]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "fg:red"
style_root = "bold fg:bright-red"
format = '[$user ]($style)'

[directory]
style = "fg:blue"
read_only_style = "fg:blue"
repo_root_style = "bold fg:blue"
format = "[$path ]($style)"
read_only = " "
home_symbol = "~"
truncation_symbol = "…/"
truncation_length = 0
truncate_to_repo = true
fish_style_pwd_dir_length = 0
use_logical_path = true

[hostname]
format = '[$ssh_symbol](red) [$hostname](red) '
ssh_symbol = "󰖟"

[git_branch]
symbol = ""
style = "fg:cyan"
format = '[( $symbol $branch )]($style)'
only_attached = true
ignore_branches = []
truncation_length = 25
truncation_symbol = "..."
always_show_remote = false
disabled = false

[git_commit]
style = "fg:cyan"
format = "[(( $tag)( @$hash) )]($style)"
commit_hash_length = 7
only_detached = true
tag_symbol = "󰓼 "
tag_disabled = false
disabled = false

[git_status]
style = "fg:cyan"
format = '[($ahead_behind )($all_status )]($style)'
stashed = "*${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
up_to_date = ""
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "×${count}"
renamed = "»${count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
ignore_submodules = false
disabled = false

[git_metrics]
format = '[(([+$added]($added_style))([-$deleted]($deleted_style)) )](fg:cyan)'
added_style = "fg:bright-green"
deleted_style = "fg:bright-red"
only_nonzero_diffs = true
disabled = false

[git_state]
style = "fg:bright-red"
format = '[($state( $progress_current/$progress_total) )]($style bold)'
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
disabled = false

[nodejs]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[c]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[rust]
symbol = "󱘗"
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[golang]
symbol = "󰟓"
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[php]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[java]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[kotlin]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[haskell]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[python]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $version)( $virtualenv) )]($style)'
version_format = '${raw}'

[package]
disabled = false
symbol = "󰏗"
style = "fg:blue"
format = '[( $symbol( $version) )]($style)'

[docker_context]
symbol = ""
style = "fg:blue"
format = '[( $symbol( $context) )]($style)'

[kubernetes]
symbol = "󱃾"
style = "fg:purple"
format = '[( $symbol( $cluster) )]($style)'
disabled = false

[shell]
disabled = false
format = '[  $indicator ]($style)'
bash_indicator = "bash"
fish_indicator = "fish"
zsh_indicator = "zsh"
powershell_indicator = "powershell"
pwsh_indicator = "psh"
ion_indicator = "ion"
elvish_indicator = "elvish"
tcsh_indicator = "tcsh"
xonsh_indicator = "xonsh"
cmd_indicator = "cmd"
nu_indicator = "nu"
unknown_indicator = ""
style = ""

[container]
style = ""
format = '[ $symbol $name ]($style)'

[jobs]
symbol = "󰒋"
style = ""
format = '[ $symbol( $number) ]($style)'
symbol_threshold = 1
number_threshold = 1

[custom.memory_usage]
command = "starship module memory_usage"
when = '[ "${STARSHIP_COCKPIT_MEMORY_USAGE_ENABLED:-false}" = "true" ]'
format = "( $output )"
disabled = false

[memory_usage]
threshold = 0
symbol = "󰓅"
style = ""
format = '( [$symbol( ${ram})]($style) )'
disabled = false

[custom.battery]
command = """
battery_info=$(starship module battery)
if [ -n "$battery_info" ]; then
    percent=$(echo "$battery_info" | grep -o '[0-9]*%%' | sed 's/%%//')
    if [ "$percent" -le "${STARSHIP_COCKPIT_BATTERY_THRESHOLD:-0}" ]; then
        echo "$battery_info" | sed 's/%%/%/'
    fi
fi
"""
when = '[ "${STARSHIP_COCKPIT_BATTERY_ENABLED:-false}" = "true" ]'
format = "( $output )"
disabled = false

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
unknown_symbol = "󰂑"
empty_symbol = "󰂎"
format = '( [$symbol( $percentage)]($style) )'
disabled = false

[[battery.display]]
threshold = 10
style = "bold fg:bright-red"

[[battery.display]]
threshold = 20
style = "fg:bright-yellow"

[[battery.display]]
threshold = 100
style = ""

[time]
disabled = false
time_format = "%R"
style = ""
format = '[ 󰔛 $time ]($style)'

[cmd_duration]
min_time = 2000
format = '[ 󱫑 $duration ]($style)'
style = ''
show_milliseconds = false
disabled = false

[status]
disabled = false
format = '[( $symbol( $common_meaning)( $signal_name) )]($style)'
map_symbol = true
pipestatus = true
symbol = '󰅙'
success_symbol = ''
not_executable_symbol = '󰂭'
not_found_symbol = '󰍉'
sigint_symbol = '󰐊'
signal_symbol = '󱐋'
style = 'bold fg:bright-red'
recognize_signal_code = true

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:bright-green)'
error_symbol = '[❯](bold fg:bright-red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:purple)'
vimcmd_replace_symbol = '[❮](bold fg:purple)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[custom.keyboard_layout]
command = """

# Set env variables if you want to use layout aliases (in uppercase)
#     export STARSHIP_COCKPIT_KEYBOARD_LAYOUT_ABC=ENG
#     export STARSHIP_COCKPIT_KEYBOARD_LAYOUT_UKRAINIAN=UKR
#
# Implementations:
#     macOS

if [ "$(uname -s)" = "Darwin" ]; then
        input_source=$(defaults read ~/Library/Preferences/com.apple.HIToolbox.plist AppleCurrentKeyboardLayoutInputSourceID)
        layout_id=$(echo "$input_source" | cut -d '.' -f4)
        layout=$(printenv "STARSHIP_COCKPIT_KEYBOARD_LAYOUT_$(echo "$layout_id" | tr '[:lower:]' '[:upper:]')")
        echo "$layout" || echo "$layout_id"
fi

"""
symbol = "󰌌"
style = ""
format = '[( $symbol $output )]($style)'
when = '[ "${STARSHIP_COCKPIT_KEYBOARD_LAYOUT_ENABLED:-false}" = "true" ]'
disabled = false
