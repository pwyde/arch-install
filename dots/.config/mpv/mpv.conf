# mpv settings, installed as ~/.config/mpv/mpv.conf. They apply to the mpv
# command; Haruna embeds mpv and keeps its own settings.

# Decodes video on the GPU through mpv's list of reliable hardware decoders,
# falling back to software decoding when none applies.
hwdec=auto-safe

# Keeps the window open at the end of a file instead of quitting.
keep-open=yes
