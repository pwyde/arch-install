# Journal size.
#
# The default is 10% of the filesystem, capped at 4G. On a 58 GiB root, the
# journal would grow to 4G before it began rotating, which is far more history
# than is ever read back.
#
# 500M is measured rather than guessed: on a workstation in daily use it holds
# roughly a month of logs across several boots, which covers the window in
# which a regression is still worth diagnosing. SystemMaxFileSize is left
# alone; it defaults to an eighth of this, and rotation granularity scales
# with it.
#
# Btrfs needs no special handling here. systemd's own journal-nocow.conf marks
# /var/log/journal +C, and @log is a separate subvolume. Journal churn
# therefore neither fragments under copy-on-write nor bloats snapshots of the
# root.
[Journal]
SystemMaxUse=500M
