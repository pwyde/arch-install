# The stock timer runs mandb daily at midnight plus up to twelve hours of
# random delay, which suits a fleet that should not all rebuild their indexes
# at once. On a single laptop that spread only makes the run unpredictable.
#
# OnCalendar is a list, so assignments accumulate: the empty one discards the
# inherited 'daily' before the schedule below replaces it. Without it the timer
# would carry both and fire twice.
#
# Persistent=false drops the stock catch-up. A missed slot waits for the next
# day rather than rebuilding the index during the boot that follows.
#
# RandomizedDelaySec is deliberately left inherited at twelve hours; set it to
# 0 here to pin the run to the time below.
[Timer]
OnCalendar=
OnCalendar=11:15
Persistent=false
