# Skip on battery, as man-db.service already does. Holds when no AC connector
# is known, so a desktop is unaffected.
[Unit]
ConditionACPower=true

[Service]
# The kernel implements Btrfs subvolume mounts as bind mounts, which updatedb
# skips by default, so @home and the rest would go unindexed. /.snapshots holds
# five complete trees that would otherwise be indexed alongside the live one.
# Set here because pacman tracks /etc/updatedb.conf as a backup file.
ExecStart=
ExecStart=/usr/bin/updatedb --prune-bind-mounts=no --add-prunepaths=/.snapshots
