# updatedb walks the whole filesystem to rebuild the locate index, which makes
# its timing matter more than that of mandb. The stock timer fires daily at
# midnight, which on a laptop means either never or during the next boot.
#
# OnCalendar is a list, and assignments accumulate: the empty one discards the
# inherited 'daily' before the schedule below replaces it. Without it the timer
# would carry both and fire twice.
#
# Persistent=false drops the stock catch-up. A slot missed while the machine
# was off waits for the next day rather than walking the filesystem during the
# boot that follows.
#
# The stock RandomizedDelaySec=1h and AccuracySec=6h are left inherited: the
# run still lands in a window after the time below rather than on it. Setting
# both here, to 0 and 1m, pins it.
[Timer]
OnCalendar=
OnCalendar=11:00
Persistent=false
