# user@.service sets TimeoutStopSec=120s in the unit itself, so the system
# manager's default never applies to it and a stuck session stalls shutdown for
# two minutes.
#
# Ten seconds rather than five: the session's own services get five, and this
# leaves the manager time to reap them before KillMode=mixed kills the cgroup.
[Service]
TimeoutStopSec=10s
