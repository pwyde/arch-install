# A core dump is the full memory image of a crashed process, so one from
# gpg-agent, a browser or a password manager holds exactly the keys and
# passphrases the disk encryption exists to protect.
#
# Both settings are needed. Storage=none alone still has the core written to
# /var/lib/systemd/coredump under a temporary or unlinked name and removed only
# after processing; ProcessSizeMax=0 is what stops it being written at all.
# Together they disable coredump handling except for a log entry.
#
# RLIMIT_CORE, whether from limits.conf or DefaultLimitCORE, is not the lever
# here: the kernel ignores it whenever core_pattern pipes to a program, which
# is how systemd collects dumps. See core(5) and coredump.conf(5).
[Coredump]
Storage=none
ProcessSizeMax=0
