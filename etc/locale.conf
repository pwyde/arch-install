# Default locale, used for every category not set below.
LANG=en_GB.UTF-8
# Language of messages and of yes/no responses.
LC_MESSAGES=en_GB.UTF-8
# Character classification and case conversion.
LC_CTYPE=@LOCALE@
# Number formatting.
LC_NUMERIC=@LOCALE@
# Date and time formats.
LC_TIME=@LOCALE@
# Monetary formatting.
LC_MONETARY=@LOCALE@
# Measurement system, metric or imperial.
LC_MEASUREMENT=@LOCALE@
# Postal address format.
LC_ADDRESS=@LOCALE@
# Telephone number format.
LC_TELEPHONE=@LOCALE@
# Paper size.
LC_PAPER=@LOCALE@
# Collation order.
LC_COLLATE=@LOCALE@
