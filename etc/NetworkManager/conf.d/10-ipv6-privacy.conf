# Prefer a temporary, rotating IPv6 address (RFC 4941) over one derived from
# the interface identifier, which would otherwise follow this machine between
# networks and link its activity across them.
#
# IPv6 is deliberately left enabled. Disabling it through sysctl breaks
# software that binds ::1, gains nothing on an IPv4-only network, and costs
# connectivity rather than privacy on a dual-stack one. To turn it off anyway,
# ipv6.disable=1 as a kernel parameter in etc/cmdline.d/ is the supported way.
[connection]
ipv6.ip6-privacy=2
