# Reflector configuration for reflector.timer, which rewrites the mirror list
# weekly. Each line holds reflector command-line arguments; see
# "reflector --help".
#
# Of the 20 most recently synchronized HTTPS mirrors in the country of the time
# zone, the five with the highest download rate are kept. base-install.sh fills
# in the country code from /usr/share/zoneinfo/zone.tab, or removes the line
# for a time zone without a country, such as UTC; the mirrors are then chosen
# from every country by download rate alone. When no mirror matches,
# reflector keeps the existing mirror list.

--save /etc/pacman.d/mirrorlist
--protocol https
--country @REFLECTOR_COUNTRY@
--latest 20
--sort rate
--number 5
