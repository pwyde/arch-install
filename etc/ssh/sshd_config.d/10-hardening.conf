# Ciphers, KexAlgorithms and MACs are deliberately absent. OpenSSH's defaults
# lead with the hybrid post-quantum exchanges mlkem768x25519-sha256 and
# sntrup761x25519-sha512; any hand-written list pins the connection to whatever
# was current when it was written and silently drops what is added later.

# Root has no reason to log in over the network. The default, prohibit-password,
# still permits it by key.
PermitRootLogin no

# Keys only.
PasswordAuthentication no
KbdInteractiveAuthentication no

# Only this account. Add others here rather than relying on shell or group
# membership to keep them out.
AllowUsers @USERNAME@

# Records the fingerprint of the key each session authenticated with, which is
# what makes an unexpected login attributable afterwards.
LogLevel VERBOSE

# Three attempts instead of six. PerSourcePenalties, on by default since 9.8,
# already throttles a source that keeps failing.
MaxAuthTries 3

# This host is not a jump box and lends nobody its agent.
AllowTcpForwarding no
AllowAgentForwarding no

# Drop a session whose peer has disappeared rather than leaving it pinned.
ClientAliveInterval 300
ClientAliveCountMax 2
