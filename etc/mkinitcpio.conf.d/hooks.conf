# mkinitcpio drop-in: initramfs hooks for a LUKS2 root unlocked with TPM2 and a
# PIN, with a Plymouth boot splash.
#
# Drop-ins are read after /etc/mkinitcpio.conf, so this HOOKS replaces the one
# there. They are ignored when mkinitcpio is given a config file with -c, which
# includes a preset that sets ALL_config or <preset>_config.
#
# Hook order follows the Arch wiki's systemd-based initramfs layout for LUKS:
#   plymouth       - after systemd and before sd-encrypt, so the splash is up to
#                    take the TPM2 PIN through systemd-ask-password.
#   keyboard       - loads keyboard modules, so a USB keyboard works at the PIN
#                    prompt. Not the same as sd-vconsole, which only sets the
#                    keymap and font.
#   sd-vconsole    - applies /etc/vconsole.conf in the initramfs.
#   vconsole-latin - local hook, after sd-vconsole: swaps a non-Latin XKBLAYOUT
#                    for "us" in the initramfs copy of vconsole.conf, so the
#                    password prompt stays typeable.
#   block          - before sd-encrypt, so the block device modules backing the
#                    LUKS container are present when it runs.
#   sd-encrypt     - systemd-based unlock; the only hook that can use the TPM2
#                    token written by systemd-cryptenroll.
HOOKS=(base systemd plymouth autodetect microcode modconf kms keyboard sd-vconsole vconsole-latin block sd-encrypt filesystems fsck)
