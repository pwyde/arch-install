# Initramfs hooks for a LUKS2 root with a Plymouth boot splash and bootable
# Btrfs snapshots.
#
# Drop-ins are read after /etc/mkinitcpio.conf, so this HOOKS replaces the one
# there. They are ignored when mkinitcpio is given a config file with -c, which
# includes a preset that sets ALL_config or <preset>_config.
#
#   plymouth         - after udev and before encrypt, so the splash is up to
#                      take the LUKS passphrase.
#   keyboard         - loads keyboard modules, so a USB keyboard works at the
#                      passphrase prompt.
#   keymap           - applies KEYMAP from /etc/vconsole.conf.
#   consolefont      - applies FONT from /etc/vconsole.conf.
#   vconsole-latin   - local hook: puts /etc/vconsole.conf in the initramfs, and
#                      swaps a non-Latin XKBLAYOUT for "us" so the passphrase
#                      prompt stays typeable.
#   block            - before encrypt, so the modules backing the LUKS container
#                      are present when it runs.
#   encrypt          - unlocks the container named by cryptdevice= on the
#                      kernel command line.
#   btrfs-overlayfs  - from limine-mkinitcpio-hook: mounts a read-only snapshot
#                      under a writable overlay, so snapshot entries boot.
HOOKS=(base udev plymouth keyboard autodetect microcode modconf kms keymap consolefont vconsole-latin block encrypt filesystems fsck btrfs-overlayfs)
