# Initramfs hooks for a LUKS2 root with a Plymouth boot splash and bootable
# Btrfs snapshots.
#
# Drop-ins are read after /etc/mkinitcpio.conf, so this HOOKS replaces the one
# there. They are ignored when mkinitcpio is given a config file with -c, which
# includes a preset that sets ALL_config or <preset>_config.
#
# Hook order follows the Arch wiki's systemd-based initramfs layout for LUKS:
#   plymouth          - after systemd and before sd-encrypt, so the splash is up
#                       to take the passphrase through systemd-ask-password.
#   keyboard          - loads keyboard modules, so a USB keyboard works at the
#                       passphrase prompt. Not the same as sd-vconsole, which
#                       only sets the keymap and font.
#   sd-vconsole       - applies /etc/vconsole.conf in the initramfs.
#   vconsole-latin    - local hook, after sd-vconsole: swaps a non-Latin
#                       XKBLAYOUT for "us" in the initramfs copy of
#                       vconsole.conf, so the passphrase prompt stays typeable.
#   block             - before sd-encrypt, so the block device modules backing
#                       the LUKS container are present when it runs.
#   sd-encrypt        - unlocks the container named by rd.luks.name= on the
#                       kernel command line.
#   sd-btrfs-overlayfs - from limine-mkinitcpio-hook: mounts a read-only
#                       snapshot under a writable overlay, so snapshot entries
#                       boot. Requires the systemd hook; the busybox variant is
#                       named btrfs-overlayfs instead.
#
# Resuming from hibernation needs no hook here: the systemd hook already ships
# systemd-hibernate-resume, which reads the resume= parameters.
HOOKS=(base systemd plymouth autodetect microcode modconf kms keyboard sd-vconsole vconsole-latin block sd-encrypt filesystems fsck sd-btrfs-overlayfs)
