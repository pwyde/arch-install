# When the kernel command line has no console=, systemd-stub checks whether the
# firmware's ConOut includes a serial port and, if so, appends
# console=uart,io,0x3f8 console=tty0 itself. QEMU with OVMF always offers one,
# as do machines with serial redirection enabled in firmware. Plymouth then
# sees a serial console and forces details mode on every display, so the LUKS
# prompt falls back to plain text.
#
# Naming any console makes the stub stand down, and tty0 is the console the
# kernel would use anyway where ConOut is not serial. It also keeps
# /proc/cmdline identical to what is assembled from /etc/cmdline.d/.
console=tty0
