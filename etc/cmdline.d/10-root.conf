# Root filesystem and the LUKS container holding it.
#
# rd.luks.name is what sd-encrypt reads; the UUID is that of the LUKS
# partition, not of the Btrfs filesystem inside it. zswap is off because zram
# provides compressed swap instead.
rd.luks.name=@ROOT_UUID@=cryptroot root=/dev/mapper/cryptroot zswap.enabled=0 rw rootfstype=btrfs rootflags=subvol=/@
