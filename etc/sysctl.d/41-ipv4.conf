# IPv4 performance.
#
# tcp_timestamps stays at its default of 1. The Arch wiki warns against turning
# it off: it carries PAWS protection against wrapping sequence numbers at
# gigabit speeds and the round-trip time calculation. The uptime disclosure it
# used to allow is gone, since Linux randomises the offset per connection.
#
# tcp_keepalive_time stays at the 120 Arch sets in
# /usr/lib/sysctl.d/10-arch.conf. Shortening it only wakes the radio sooner.

# Autotuning bounds: minimum, initial, maximum.
net.ipv4.tcp_rmem = 4096 1048576 2097152
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Carry data in the opening SYN, as client and as server.
net.ipv4.tcp_fastopen = 3

# Queue of connections waiting to be acknowledged. Once it fills, the syncookie
# setting in 60-net-hardening.conf takes over.
net.ipv4.tcp_max_syn_backlog = 8192

# Do not fall back to the initial window on a connection that has merely been
# idle; it costs throughput on long-lived ones.
net.ipv4.tcp_slow_start_after_idle = 0

# Reuse a TIME-WAIT socket for a new outgoing connection when its timestamp is
# newer, so a busy client does not exhaust local ports.
net.ipv4.tcp_tw_reuse = 1

# Close half-shut connections sooner.
net.ipv4.tcp_fin_timeout = 15

# Probe for a usable MTU when an ICMP black hole swallows the path MTU replies.
net.ipv4.tcp_mtu_probing = 1
