# BBR estimates the bottleneck bandwidth and the minimum round-trip time and
# paces to them, where cubic keeps pushing until packets drop. That empties the
# standing queue a saturated uplink builds, which is what otherwise makes one
# download feel like it breaks everything else on the link.
#
# fq is the queueing discipline BBR is built to pace through. tcp_bbr is loaded
# by etc/modules-load.d/bbr.conf: sysctl cannot select an algorithm the kernel
# has not registered yet.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
