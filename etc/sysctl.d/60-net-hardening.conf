# Network hardening, following the Arch wiki's "TCP/IP stack hardening".

# Answer a full SYN queue with cookies rather than dropping connections. The
# default since linux 5.10, set here because 41-ipv4.conf sizes the queue for
# it.
net.ipv4.tcp_syncookies = 1

# Drop RST packets for sockets in TIME-WAIT, closing the time-wait
# assassination hazard.
net.ipv4.tcp_rfc1337 = 1

# Strict reverse path filtering: a packet is dropped unless the reply would
# leave by the interface it arrived on. systemd ships 2, loose mode, in
# /usr/lib/sysctl.d/50-default.conf.
#
# The glob is the form the wiki gives, and the form matters. The kernel takes
# the maximum of conf.all and the per-interface value, so setting conf.all
# would pin every interface to strict with no way to relax one -- and a VPN, a
# bridge, or any asymmetric route may need loose mode on its interface alone.
# The leading '-' tolerates conf.all being absent.
net.ipv4.conf.*.rp_filter = 1
-net.ipv4.conf.all.rp_filter

# Log packets carrying an impossible source address.
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.all.log_martians = 1

# Do not answer broadcast pings; answering is what makes a host useful for
# smurf amplification.
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore malformed ICMP error replies instead of logging every one.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ICMP redirects rewrite the routing table. This is not a router, so neither
# send them nor accept them.
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
