# Kernel hardening. None of these are kernel defaults, and Arch sets none of
# them, so without this file they are all off.

# Keep the kernel log away from unprivileged readers: it leaks addresses and
# hardware detail useful for building an exploit.
kernel.dmesg_restrict = 1

# Hide kernel pointers from unprivileged readers of /proc and similar.
kernel.kptr_restrict = 1

# Restrict ptrace to a process's own descendants, so one compromised program
# cannot read memory out of the rest of the session.
kernel.yama.ptrace_scope = 1

# Keep kernel messages off the console. The quiet-boot parameters in
# etc/cmdline.d/90-splash.conf cover the boot; this covers everything after.
kernel.printk = 3 3 3 3
