# Core network buffers.
#
# Only the maxima are raised. TCP autotuning grows each socket from the
# tcp_rmem/tcp_wmem floor as traffic warrants, so raising the defaults would
# enlarge every socket instead of the few that need it. The Arch wiki notes
# that the larger figures circulated online trace back to a Cloudflare post and
# are only needed at 40Gb speeds.

# Receive queue for frames taken off the NIC ring buffer.
net.core.netdev_max_backlog = 16384

# Upper limit on the listen() backlog. Only a loaded server benefits, and
# raising it further can slow a single-threaded one down.
net.core.somaxconn = 8192

# Largest buffer a socket may request.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Ancillary (struct cmsghdr) buffer per socket.
net.core.optmem_max = 65536
