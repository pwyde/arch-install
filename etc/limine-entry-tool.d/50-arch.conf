# limine-entry-tool settings that do not depend on this machine.
#
# The kernel command line is NOT set here. It is written to /etc/default/limine
# by the installer, assembled from /etc/cmdline.d/, which stays the single
# source of truth. limine-entry-tool reads a command line only from
# /etc/kernel/cmdline or /proc/cmdline and never from /etc/cmdline.d/, so it
# has to be pinned explicitly -- and any KERNEL_CMDLINE[...]+= makes the tool
# ignore both of those fallbacks.

TARGET_OS_NAME="Arch Linux"

# Produces arch_linux.efi, the name the installer already wrote, so the UKIs
# are replaced rather than a second set being added alongside them.
CUSTOM_UKI_NAME="arch"

ENABLE_UKI=yes
ENABLE_LIMINE_FALLBACK=yes
FIND_BOOTLOADERS=yes

BOOT_ORDER="*, *fallback, Snapshots"

# Snapper keeps 5 snapshots, but limine-snapper-sync can see a newly created
# sixth before cleanup runs. Allowing 6 avoids a spurious limit mismatch.
MAX_SNAPSHOT_ENTRIES=6

SNAPSHOT_FORMAT_CHOICE=5
