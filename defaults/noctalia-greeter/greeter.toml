[session]
default = "niri"

[appearance]
scheme = "Synced"
hide_logo = true
theme_mode = "dark"
corner_radius_scale = 1.0
font_family = "Inter"

[clock]
enabled = true
position = "above-panel"
time_format = "{:%H:%M}"
date_format = "%A, %x"

[output]
height = @OUTPUT_HEIGHT@
name = "@OUTPUT_NAME@"
refresh_rate = @OUTPUT_REFRESH_RATE@
scale = @OUTPUT_SCALE@
width = @OUTPUT_WIDTH@

[cursor]
size = 24
theme = "XCursor-Pro-Dark"

[keyboard]
layout = "@XKB_LAYOUT@"
numlock = true
