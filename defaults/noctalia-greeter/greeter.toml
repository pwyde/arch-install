[session]
default = "niri"

[appearance]
scheme = "Synced"
hide_logo = true
theme_mode = "dark"
corner_radius_scale = 1.0
font_family = "Inter"

[clock]
enabled = true
position = "above-panel"
time_format = "{:%H:%M}"
date_format = "%A, %x"

[output]
height = 2160
name = "Virtual-1"
refresh_rate = 60.0
scale = 1.5
width = 3840

[cursor]
size = 24
theme = "XCursor-Pro-Dark"

[keyboard]
layout = "se"
numlock = true
