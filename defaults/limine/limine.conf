# Reference: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 5

# By path rather than index. "Arch Linux" is a directory holding the kernel,
# fallback and Snapshots entries: index 1 would name the directory, and Limine
# disables autoboot when the default entry is not bootable.
default_entry: Arch Linux/linux

interface_branding: Arch Linux
interface_branding_color: ffffff
interface_help_color: 1793d1
interface_help_color_bright: 1793d1
hash_mismatch_panic: no

term_background: 000000
backdrop: 000000

term_palette: 000000;bf616a;a3be8c;ebcb8b;5e81ac;b48ead;ffffff;d8dee9
term_palette_bright: 1a1a1a;bf616a;a3be8c;ebcb8b;5e81ac;b48ead;ffffff;eceff4
term_foreground: 999999
term_foreground_bright: 999999
term_background_bright: 1a1a1a

# No boot entries here. limine-entry-tool writes them when
# limine-mkinitcpio-hook is installed: an "Arch Linux" directory holding linux,
# linux-fallback and Snapshots. Entries written by hand would sit alongside
# those as duplicates.
