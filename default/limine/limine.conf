### Read more at https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 5
default_entry: 1

interface_branding: Arch Linux
interface_branding_color: ffffff
interface_help_color: 1793d1
interface_help_color_bright: 1793d1
hash_mismatch_panic: no

term_background: 000000
backdrop: 000000

term_palette: 000000;bf616a;a3be8c;ebcb8b;5e81ac;b48ead;ffffff;d8dee9
term_palette_bright: 1a1a1a;bf616a;a3be8c;ebcb8b;5e81ac;b48ead;ffffff;eceff4
term_foreground: 999999
term_foreground_bright: 999999
term_background_bright: 1a1a1a

/Arch Linux
    comment: Unified Kernel Image
    protocol: efi
    path: boot():/EFI/Linux/arch_linux.efi

/Arch Linux (fallback)
    comment: Fallback Unified Kernel Image
    protocol: efi
    path: boot():/EFI/Linux/arch_linux-fallback.efi
